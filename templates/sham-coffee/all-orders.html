<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قهوة الشام | جميع الطلبات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --primary: #A78BFA;
            --primary-dark: #7C3AED;
            --primary-light: #C4B5FD;
            --secondary: #F59E0B;
            --accent: #FBBF24;
            --gold: #FCD34D;
            --bg: #0F172A;
            --bg-secondary: #1E293B;
            --card-bg: #1E293B;
            --card-hover: #334155;
            --text: #F1F5F9;
            --text-secondary: #94A3B8;
            --border: #334155;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --gradient: linear-gradient(135deg, #A78BFA 0%, #F59E0B 50%, #FBBF24 100%);
            --shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .main-content {
            margin-right: 280px;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .page-title h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .page-title p {
            color: var(--text-secondary);
        }

        .filters-section {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .filters-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .filter-select, .filter-input {
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .filter-select:focus, .filter-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.1);
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 20px;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .filter-btn.active {
            background: var(--gradient);
            color: white;
            border-color: transparent;
        }

        .filter-btn:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: var(--shadow);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .stat-icon.orders { background: rgba(167, 139, 250, 0.2); color: var(--primary); }
        .stat-icon.revenue { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .stat-icon.items { background: rgba(245, 158, 11, 0.2); color: var(--secondary); }
        .stat-icon.avg { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }

        .stat-info h3 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .stat-info p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .orders-table-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
        }

        .table-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-header h3 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .table-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .orders-table {
            width: 100%;
            border-collapse: collapse;
        }

        .orders-table thead {
            background: var(--bg-secondary);
        }

        .orders-table th {
            padding: 15px;
            text-align: right;
            font-weight: 700;
            color: var(--text);
            border-bottom: 2px solid var(--border);
        }

        .orders-table td {
            padding: 15px;
            border-bottom: 1px solid var(--border);
        }

        .orders-table tbody tr {
            transition: all 0.2s ease;
        }

        .orders-table tbody tr:hover {
            background: var(--bg-secondary);
        }

        .order-id {
            font-weight: 700;
            color: var(--primary);
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
        }

        .status-new { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        .status-processing { background: rgba(218, 165, 32, 0.1); color: var(--gold); }
        .status-completed { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .status-cancelled { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .status-paid { background: rgba(16, 185, 129, 0.1); color: var(--success); }

        .order-details-btn {
            padding: 6px 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .order-details-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
        }

        .order-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .order-modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h2 {
            font-size: 1.5rem;
            font-weight: 800;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 2rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .modal-close:hover {
            color: var(--text);
        }

        .order-detail-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .order-detail-item:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: var(--text-secondary);
            font-weight: 600;
        }

        .detail-value {
            font-weight: 700;
        }

        .items-list {
            margin-top: 15px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: var(--bg-secondary);
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        @media (max-width: 1024px) {
            .main-content {
                margin-right: 0;
                padding: 20px;
            }

            .orders-table {
                font-size: 0.9rem;
            }

            .orders-table th,
            .orders-table td {
                padding: 10px 8px;
            }
        }

        @media (max-width: 768px) {
            .filters-row {
                grid-template-columns: 1fr;
            }

            .stats-cards {
                grid-template-columns: 1fr;
            }

            .orders-table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <aside class="sidebar"></aside>

    <main class="main-content">
        <header class="header">
            <div class="page-title">
                <h1><i class="fas fa-list-alt"></i> جميع الطلبات</h1>
                <p>عرض وتصفية جميع الطلبات حسب الفترة الزمنية</p>
            </div>
        </header>

        <!-- Filters Section -->
        <div class="filters-section">
            <div class="filters-row">
                <div class="filter-group">
                    <label class="filter-label">نوع الفلترة</label>
                    <select class="filter-select" id="period-filter">
                        <option value="today">اليوم</option>
                        <option value="week">هذا الأسبوع</option>
                        <option value="month">هذا الشهر</option>
                        <option value="year">هذا العام</option>
                        <option value="custom">مخصص</option>
                    </select>
                </div>
                <div class="filter-group" id="custom-dates" style="display: none;">
                    <label class="filter-label">من تاريخ</label>
                    <input type="date" class="filter-input" id="date-from">
                </div>
                <div class="filter-group" id="custom-dates-to" style="display: none;">
                    <label class="filter-label">إلى تاريخ</label>
                    <input type="date" class="filter-input" id="date-to">
                </div>
                <div class="filter-group">
                    <label class="filter-label">حالة الطلب</label>
                    <select class="filter-select" id="status-filter">
                        <option value="all">جميع الحالات</option>
                        <option value="new">جديد</option>
                        <option value="processing">قيد التحضير</option>
                        <option value="completed">مكتمل</option>
                        <option value="paid">مدفوع</option>
                        <option value="cancelled">ملغي</option>
                    </select>
                </div>
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="setPeriod('today')">اليوم</button>
                <button class="filter-btn" onclick="setPeriod('week')">هذا الأسبوع</button>
                <button class="filter-btn" onclick="setPeriod('month')">هذا الشهر</button>
                <button class="filter-btn" onclick="setPeriod('year')">هذا العام</button>
                <button class="filter-btn" onclick="setPeriod('all')">الكل</button>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="stats-cards">
            <div class="stat-card">
                <div class="stat-icon orders">
                    <i class="fas fa-shopping-cart"></i>
                </div>
                <div class="stat-info">
                    <h3 id="stat-orders">0</h3>
                    <p>عدد الطلبات</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon revenue">
                    <i class="fas fa-money-bill-wave"></i>
                </div>
                <div class="stat-info">
                    <h3 id="stat-revenue">0.000</h3>
                    <p>إجمالي الإيرادات (ر.ع)</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon items">
                    <i class="fas fa-box"></i>
                </div>
                <div class="stat-info">
                    <h3 id="stat-items">0</h3>
                    <p>عدد الأصناف المباعة</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon avg">
                    <i class="fas fa-chart-line"></i>
                </div>
                <div class="stat-info">
                    <h3 id="stat-avg">0.000</h3>
                    <p>متوسط قيمة الطلب (ر.ع)</p>
                </div>
            </div>
        </div>

        <!-- Orders Table -->
        <div class="orders-table-container">
            <div class="table-header">
                <h3><i class="fas fa-table"></i> قائمة الطلبات</h3>
                <div class="table-actions">
                    <button class="btn btn-secondary" onclick="exportToCSV()">
                        <i class="fas fa-download"></i> تصدير CSV
                    </button>
                    <button class="btn btn-primary" onclick="printOrders()">
                        <i class="fas fa-print"></i> طباعة
                    </button>
                </div>
            </div>
            <table class="orders-table">
                <thead>
                    <tr>
                        <th>رقم الطلب</th>
                        <th>العميل</th>
                        <th>التاريخ</th>
                        <th>الأصناف</th>
                        <th>المبلغ</th>
                        <th>الحالة</th>
                        <th>طريقة الدفع</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="orders-tbody">
                    <tr>
                        <td colspan="8" class="empty-state">
                            <i class="fas fa-spinner fa-spin"></i>
                            <p>جاري تحميل الطلبات...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Order Details Modal -->
    <div class="order-modal" id="order-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>تفاصيل الطلب</h2>
                <button class="modal-close" onclick="closeOrderModal()">&times;</button>
            </div>
            <div id="order-details-content">
                <!-- Order details will be loaded here -->
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/sidebar.js"></script>

    <script>
        const RESTAURANT_ID = 'sham-coffee-1';
        const ORDERS_PATH = `restaurant-system/restaurants/${RESTAURANT_ID}/orders`;
        const CANCELLED_ORDERS_PATH = `restaurant-system/restaurants/${RESTAURANT_ID}/cancelled-orders`;
        
        let allOrders = [];
        let currentPeriod = 'today';
        let currentStatus = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            initFirebaseListeners();
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('period-filter').addEventListener('change', (e) => {
                if (e.target.value === 'custom') {
                    document.getElementById('custom-dates').style.display = 'block';
                    document.getElementById('custom-dates-to').style.display = 'block';
                } else {
                    document.getElementById('custom-dates').style.display = 'none';
                    document.getElementById('custom-dates-to').style.display = 'none';
                    setPeriod(e.target.value);
                }
            });

            document.getElementById('status-filter').addEventListener('change', (e) => {
                currentStatus = e.target.value;
                filterAndRenderOrders();
            });

            document.getElementById('date-from').addEventListener('change', filterAndRenderOrders);
            document.getElementById('date-to').addEventListener('change', filterAndRenderOrders);
        }

        function initFirebaseListeners() {
            const ordersRef = firebase.database().ref(ORDERS_PATH);
            const cancelledOrdersRef = firebase.database().ref(CANCELLED_ORDERS_PATH);

            // الطلبات النشطة
            ordersRef.on('value', (snapshot) => {
                const data = snapshot.val();
                const activeOrders = data ? Object.entries(data).map(([key, value]) => ({ id: key, ...value })) : [];
                
                // الطلبات الملغية
                cancelledOrdersRef.once('value', (cancelledSnapshot) => {
                    const cancelledData = cancelledSnapshot.val();
                    const cancelledOrders = cancelledData ? Object.entries(cancelledData).map(([key, value]) => ({ id: key, ...value, status: 'cancelled' })) : [];
                    
                    allOrders = [...activeOrders, ...cancelledOrders];
                    filterAndRenderOrders();
                });
            });
        }

        function setPeriod(period) {
            currentPeriod = period;
            document.getElementById('period-filter').value = period;
            
            // Update active button
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event?.target?.classList.add('active');
            
            filterAndRenderOrders();
        }

        function getDateRange(period) {
            const now = new Date();
            let start, end;

            switch(period) {
                case 'today':
                    start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                    end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
                    break;
                case 'week':
                    const dayOfWeek = now.getDay();
                    const diff = now.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1); // Monday
                    start = new Date(now.getFullYear(), now.getMonth(), diff);
                    start.setHours(0, 0, 0, 0);
                    end = new Date(now);
                    end.setHours(23, 59, 59, 999);
                    break;
                case 'month':
                    start = new Date(now.getFullYear(), now.getMonth(), 1);
                    end = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59);
                    break;
                case 'year':
                    start = new Date(now.getFullYear(), 0, 1);
                    end = new Date(now.getFullYear(), 11, 31, 23, 59, 59);
                    break;
                case 'custom':
                    const fromDate = document.getElementById('date-from').value;
                    const toDate = document.getElementById('date-to').value;
                    if (fromDate && toDate) {
                        start = new Date(fromDate);
                        end = new Date(toDate);
                        end.setHours(23, 59, 59, 999);
                    } else {
                        return { start: null, end: null };
                    }
                    break;
                default:
                    return { start: null, end: null };
            }

            return { start, end };
        }

        function filterAndRenderOrders() {
            const { start, end } = getDateRange(currentPeriod);
            
            let filtered = allOrders.filter(order => {
                // Filter by date
                if (start && end) {
                    const orderDate = new Date(order.createdAt || order.timestamp || order.cancelledAt || 0);
                    if (orderDate < start || orderDate > end) {
                        return false;
                    }
                }

                // Filter by status
                if (currentStatus !== 'all' && order.status !== currentStatus) {
                    return false;
                }

                return true;
            });

            // Sort by date (newest first)
            filtered.sort((a, b) => {
                const dateA = new Date(a.createdAt || a.timestamp || a.cancelledAt || 0);
                const dateB = new Date(b.createdAt || b.timestamp || b.cancelledAt || 0);
                return dateB - dateA;
            });

            renderOrders(filtered);
            updateStats(filtered);
        }

        function renderOrders(orders) {
            const tbody = document.getElementById('orders-tbody');

            if (orders.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <p>لا توجد طلبات في هذه الفترة</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = orders.map(order => {
                const orderDate = new Date(order.createdAt || order.timestamp || order.cancelledAt || 0);
                const itemsCount = order.items ? order.items.reduce((sum, item) => sum + (item.quantity || 1), 0) : 0;
                const statusText = {
                    'new': 'جديد',
                    'processing': 'قيد التحضير',
                    'completed': 'مكتمل',
                    'paid': 'مدفوع',
                    'cancelled': 'ملغي'
                }[order.status] || order.status;

                const paymentMethod = order.paymentMethod || 'غير محدد';
                const customerName = order.customerName || order.tableNumber || 'عميل';

                return `
                    <tr>
                        <td class="order-id">#${String(order.id).slice(-6)}</td>
                        <td>${customerName}</td>
                        <td>${orderDate.toLocaleString('ar-EG', { 
                            year: 'numeric', 
                            month: 'short', 
                            day: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        })}</td>
                        <td>${itemsCount} صنف</td>
                        <td><strong>${parseFloat(order.total || 0).toFixed(3)} ر.ع</strong></td>
                        <td><span class="status-badge status-${order.status}">${statusText}</span></td>
                        <td>${paymentMethod === 'cash' ? 'نقدي' : paymentMethod === 'card' ? 'بطاقة' : paymentMethod}</td>
                        <td>
                            <button class="order-details-btn" onclick="showOrderDetails('${order.id}')">
                                <i class="fas fa-eye"></i> تفاصيل
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function updateStats(orders) {
            const totalOrders = orders.length;
            const totalRevenue = orders
                .filter(o => o.status === 'completed' || o.status === 'paid')
                .reduce((sum, o) => sum + parseFloat(o.total || 0), 0);
            const totalItems = orders.reduce((sum, order) => {
                return sum + (order.items ? order.items.reduce((s, item) => s + (item.quantity || 1), 0) : 0);
            }, 0);
            const avgOrder = totalOrders > 0 ? totalRevenue / totalOrders : 0;

            document.getElementById('stat-orders').textContent = totalOrders.toLocaleString('ar-SA');
            document.getElementById('stat-revenue').textContent = totalRevenue.toFixed(3);
            document.getElementById('stat-items').textContent = totalItems.toLocaleString('ar-SA');
            document.getElementById('stat-avg').textContent = avgOrder.toFixed(3);
        }

        function showOrderDetails(orderId) {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) return;

            const orderDate = new Date(order.createdAt || order.timestamp || order.cancelledAt || 0);
            const cancelledBy = order.cancelledBy || null;

            let detailsHTML = `
                <div class="order-detail-item">
                    <span class="detail-label">رقم الطلب:</span>
                    <span class="detail-value">#${String(order.id).slice(-6)}</span>
                </div>
                <div class="order-detail-item">
                    <span class="detail-label">العميل:</span>
                    <span class="detail-value">${order.customerName || order.tableNumber || 'عميل'}</span>
                </div>
                <div class="order-detail-item">
                    <span class="detail-label">رقم الهاتف:</span>
                    <span class="detail-value">${order.customerPhone || 'غير متوفر'}</span>
                </div>
                <div class="order-detail-item">
                    <span class="detail-label">التاريخ والوقت:</span>
                    <span class="detail-value">${orderDate.toLocaleString('ar-EG', { 
                        year: 'numeric', 
                        month: 'long', 
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    })}</span>
                </div>
                <div class="order-detail-item">
                    <span class="detail-label">الحالة:</span>
                    <span class="detail-value"><span class="status-badge status-${order.status}">${
                        order.status === 'new' ? 'جديد' :
                        order.status === 'processing' ? 'قيد التحضير' :
                        order.status === 'completed' ? 'مكتمل' :
                        order.status === 'paid' ? 'مدفوع' :
                        order.status === 'cancelled' ? 'ملغي' : order.status
                    }</span></span>
                </div>
                <div class="order-detail-item">
                    <span class="detail-label">طريقة الدفع:</span>
                    <span class="detail-value">${order.paymentMethod === 'cash' ? 'نقدي' : order.paymentMethod === 'card' ? 'بطاقة' : order.paymentMethod || 'غير محدد'}</span>
                </div>
            `;

            if (cancelledBy) {
                const cancelledDate = new Date(order.cancelledAt || 0);
                detailsHTML += `
                    <div class="order-detail-item">
                        <span class="detail-label">ألغاه:</span>
                        <span class="detail-value">${cancelledBy.name || 'غير معروف'}</span>
                    </div>
                    <div class="order-detail-item">
                        <span class="detail-label">تاريخ الإلغاء:</span>
                        <span class="detail-value">${cancelledDate.toLocaleString('ar-EG')}</span>
                    </div>
                `;
            }

            detailsHTML += `
                <div style="margin-top: 20px;">
                    <h3 style="margin-bottom: 15px; font-size: 1.1rem;">الأصناف:</h3>
                    <div class="items-list">
                        ${order.items ? order.items.map(item => `
                            <div class="item-row">
                                <span>${item.quantity || 1}x ${item.name || 'منتج'}</span>
                                <span><strong>${((item.price || 0) * (item.quantity || 1)).toFixed(3)} ر.ع</strong></span>
                            </div>
                        `).join('') : '<p>لا توجد أصناف</p>'}
                    </div>
                </div>
                <div class="order-detail-item" style="margin-top: 20px; padding-top: 20px; border-top: 2px solid var(--border);">
                    <span class="detail-label" style="font-size: 1.2rem;">الإجمالي:</span>
                    <span class="detail-value" style="font-size: 1.2rem; color: var(--primary);">${parseFloat(order.total || 0).toFixed(3)} ر.ع</span>
                </div>
            `;

            if (order.customerAddress) {
                detailsHTML = detailsHTML.replace(
                    '</div><div style="margin-top: 20px;">',
                    `<div class="order-detail-item">
                        <span class="detail-label">عنوان التوصيل:</span>
                        <span class="detail-value">${order.customerAddress}</span>
                    </div></div><div style="margin-top: 20px;">`
                );
            }

            document.getElementById('order-details-content').innerHTML = detailsHTML;
            document.getElementById('order-modal').classList.add('active');
        }

        function closeOrderModal() {
            document.getElementById('order-modal').classList.remove('active');
        }

        function exportToCSV() {
            const { start, end } = getDateRange(currentPeriod);
            let filtered = allOrders.filter(order => {
                if (start && end) {
                    const orderDate = new Date(order.createdAt || order.timestamp || order.cancelledAt || 0);
                    if (orderDate < start || orderDate > end) return false;
                }
                if (currentStatus !== 'all' && order.status !== currentStatus) return false;
                return true;
            });

            let csv = 'رقم الطلب,العميل,التاريخ,الأصناف,المبلغ,الحالة,طريقة الدفع\n';
            filtered.forEach(order => {
                const orderDate = new Date(order.createdAt || order.timestamp || order.cancelledAt || 0);
                const itemsCount = order.items ? order.items.reduce((sum, item) => sum + (item.quantity || 1), 0) : 0;
                const statusText = {
                    'new': 'جديد',
                    'processing': 'قيد التحضير',
                    'completed': 'مكتمل',
                    'paid': 'مدفوع',
                    'cancelled': 'ملغي'
                }[order.status] || order.status;
                const paymentMethod = order.paymentMethod === 'cash' ? 'نقدي' : order.paymentMethod === 'card' ? 'بطاقة' : order.paymentMethod || 'غير محدد';
                
                csv += `#${String(order.id).slice(-6)},${order.customerName || order.tableNumber || 'عميل'},${orderDate.toLocaleString('ar-EG')},${itemsCount},${parseFloat(order.total || 0).toFixed(3)},${statusText},${paymentMethod}\n`;
            });

            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `orders-${currentPeriod}-${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        function printOrders() {
            window.print();
        }

        // Close modal on outside click
        document.getElementById('order-modal').addEventListener('click', (e) => {
            if (e.target.id === 'order-modal') {
                closeOrderModal();
            }
        });
    </script>
    <script>
        // حماية الصفحة - للأدمن فقط
        if (localStorage.getItem('admin_logged_in') !== 'true') {
            if (localStorage.getItem('worker_logged_in') === 'true') {
                alert('ليس لديك صلاحية للوصول إلى هذه الصفحة');
                window.location.href = 'cashier.html';
            } else {
                window.location.href = 'login-admin.html';
            }
        }
    </script>
</body>
