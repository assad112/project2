<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قهوة الشام | إدارة العمال</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --primary: #A78BFA;
            --primary-dark: #7C3AED;
            --secondary: #F59E0B;
            --accent: #FBBF24;
            --bg: #0F172A;
            --bg-secondary: #1E293B;
            --card-bg: #1E293B;
            --card-hover: #334155;
            --text: #F1F5F9;
            --text-secondary: #94A3B8;
            --border: #334155;
            --success: #10B981;
            --danger: #EF4444;
            --gradient: linear-gradient(135deg, #A78BFA 0%, #F59E0B 50%, #FBBF24 100%);
        }

        .main-content {
            margin-right: 280px;
            padding: 30px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-title h1 {
            font-size: 28px;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .btn-primary {
            background: var(--gradient);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(167, 139, 250, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(167, 139, 250, 0.4);
        }

        .workers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .worker-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s ease;
        }

        .worker-card:hover {
            border-color: var(--primary);
            box-shadow: 0 8px 25px rgba(167, 139, 250, 0.2);
            transform: translateY(-4px);
        }

        .worker-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .worker-avatar {
            width: 60px;
            height: 60px;
            background: var(--gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .worker-info h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .worker-info p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .worker-details {
            margin: 15px 0;
        }

        .worker-detail {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        .worker-detail:last-child {
            border-bottom: none;
        }

        .worker-detail-label {
            color: var(--text-secondary);
        }

        .worker-detail-value {
            font-weight: 600;
        }

        .worker-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-active {
            background: rgba(16, 185, 129, 0.1);
            color: #6EE7B7;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-inactive {
            background: rgba(239, 68, 68, 0.1);
            color: #FCA5A5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .worker-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-edit, .btn-delete {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-edit {
            background: rgba(167, 139, 250, 0.1);
            color: var(--primary);
            border: 1px solid rgba(167, 139, 250, 0.3);
        }

        .btn-edit:hover {
            background: rgba(167, 139, 250, 0.2);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.1);
            color: #FCA5A5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            border: 1px solid var(--border);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            font-size: 24px;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .modal-close:hover {
            color: var(--text);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text);
            font-weight: 600;
            font-size: 14px;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 15px;
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.1);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6EE7B7;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #FCA5A5;
        }
    </style>
</head>
<body>
    <aside class="sidebar"></aside>
    
    <main class="main-content">
        <div class="page-header">
            <div class="page-title">
                <h1><i class="fas fa-users"></i> إدارة العمال</h1>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button class="btn-primary" onclick="openAddWorkerModal()">
                    <i class="fas fa-plus"></i> إضافة عامل جديد
                </button>
                <button class="btn-primary" onclick="logout()" style="background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2);">
                    <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
                </button>
            </div>
        </div>

        <div class="alert alert-success" id="success-alert"></div>
        <div class="alert alert-error" id="error-alert"></div>

        <div class="workers-grid" id="workers-grid">
            <!-- سيتم ملؤها ديناميكياً -->
        </div>
    </main>

    <!-- Modal إضافة/تعديل عامل -->
    <div class="modal" id="worker-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">إضافة عامل جديد</h2>
                <button class="modal-close" onclick="closeWorkerModal()">&times;</button>
            </div>

            <form id="worker-form">
                <div class="form-group">
                    <label class="form-label">اسم العامل</label>
                    <input type="text" class="form-input" id="worker-name" required placeholder="مثال: أحمد محمد">
                </div>

                <div class="form-group">
                    <label class="form-label">اسم المستخدم</label>
                    <input type="text" class="form-input" id="worker-username" required placeholder="مثال: worker1">
                </div>

                <div class="form-group">
                    <label class="form-label">كلمة المرور</label>
                    <input type="password" class="form-input" id="worker-password" required placeholder="كلمة مرور قوية">
                </div>

                <div class="form-group">
                    <label class="form-label">المنصب</label>
                    <select class="form-select" id="worker-position" required>
                        <option value="">اختر المنصب</option>
                        <option value="كاشير">كاشير</option>
                        <option value="نادل">نادل</option>
                        <option value="مشرف">مشرف</option>
                        <option value="عامل">عامل</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">الحالة</label>
                    <select class="form-select" id="worker-status" required>
                        <option value="active">نشط</option>
                        <option value="inactive">غير نشط</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%;">
                    <i class="fas fa-save"></i> حفظ
                </button>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/sidebar.js"></script>
    <script>
        const RESTAURANT_ID = 'sham-coffee-1';
        let currentWorkerId = null;

        // تحميل العمال
        function loadWorkers() {
            const workersRef = firebase.database().ref(`restaurant-system/workers/${RESTAURANT_ID}`);
            workersRef.on('value', (snapshot) => {
                const workers = snapshot.val() || {};
                const workersGrid = document.getElementById('workers-grid');
                workersGrid.innerHTML = '';

                if (Object.keys(workers).length === 0) {
                    workersGrid.innerHTML = '<p style="color: var(--text-secondary); text-align: center; grid-column: 1/-1;">لا يوجد عمال مسجلين</p>';
                    return;
                }

                Object.keys(workers).forEach(workerId => {
                    const worker = workers[workerId];
                    const workerCard = createWorkerCard(workerId, worker);
                    workersGrid.appendChild(workerCard);
                });
            });
        }

        // إنشاء بطاقة عامل
        function createWorkerCard(workerId, worker) {
            const card = document.createElement('div');
            card.className = 'worker-card';
            card.innerHTML = `
                <div class="worker-header">
                    <div class="worker-avatar">👤</div>
                    <div class="worker-info">
                        <h3>${worker.name || 'غير محدد'}</h3>
                        <p>${worker.position || 'عامل'}</p>
                    </div>
                </div>
                <div class="worker-details">
                    <div class="worker-detail">
                        <span class="worker-detail-label">اسم المستخدم:</span>
                        <span class="worker-detail-value">${worker.username}</span>
                    </div>
                    <div class="worker-detail">
                        <span class="worker-detail-label">الحالة:</span>
                        <span class="worker-status ${worker.status === 'active' ? 'status-active' : 'status-inactive'}">
                            ${worker.status === 'active' ? 'نشط' : 'غير نشط'}
                        </span>
                    </div>
                </div>
                <div class="worker-actions">
                    <button class="btn-edit" onclick="editWorker('${workerId}')">
                        <i class="fas fa-edit"></i> تعديل
                    </button>
                    <button class="btn-delete" onclick="deleteWorker('${workerId}', '${worker.name}')">
                        <i class="fas fa-trash"></i> حذف
                    </button>
                </div>
            `;
            return card;
        }

        // فتح نافذة إضافة عامل
        function openAddWorkerModal() {
            currentWorkerId = null;
            document.getElementById('modal-title').textContent = 'إضافة عامل جديد';
            document.getElementById('worker-form').reset();
            document.getElementById('worker-modal').classList.add('active');
        }

        // إغلاق النافذة
        function closeWorkerModal() {
            document.getElementById('worker-modal').classList.remove('active');
            currentWorkerId = null;
        }

        // تعديل عامل
        function editWorker(workerId) {
            const workersRef = firebase.database().ref(`restaurant-system/workers/${RESTAURANT_ID}/${workerId}`);
            workersRef.once('value', (snapshot) => {
                const worker = snapshot.val();
                currentWorkerId = workerId;
                
                document.getElementById('modal-title').textContent = 'تعديل عامل';
                document.getElementById('worker-name').value = worker.name || '';
                document.getElementById('worker-username').value = worker.username || '';
                document.getElementById('worker-password').value = '';
                document.getElementById('worker-position').value = worker.position || '';
                document.getElementById('worker-status').value = worker.status || 'active';
                
                document.getElementById('worker-modal').classList.add('active');
            });
        }

        // حذف عامل
        function deleteWorker(workerId, workerName) {
            if (!confirm(`هل أنت متأكد من حذف العامل "${workerName}"؟`)) return;

            const workersRef = firebase.database().ref(`restaurant-system/workers/${RESTAURANT_ID}/${workerId}`);
            workersRef.remove()
                .then(() => {
                    showSuccess('تم حذف العامل بنجاح');
                })
                .catch((error) => {
                    showError('حدث خطأ أثناء حذف العامل');
                    console.error(error);
                });
        }

        // حفظ عامل
        document.getElementById('worker-form').addEventListener('submit', (e) => {
            e.preventDefault();

            const workerData = {
                name: document.getElementById('worker-name').value.trim(),
                username: document.getElementById('worker-username').value.trim(),
                password: document.getElementById('worker-password').value,
                position: document.getElementById('worker-position').value,
                status: document.getElementById('worker-status').value,
                role: 'worker',
                updatedAt: firebase.database.ServerValue.TIMESTAMP
            };

            if (!currentWorkerId) {
                // إضافة جديد
                workerData.createdAt = firebase.database.ServerValue.TIMESTAMP;
                const workersRef = firebase.database().ref(`restaurant-system/workers/${RESTAURANT_ID}`).push();
                workersRef.set(workerData)
                    .then(() => {
                        showSuccess('تم إضافة العامل بنجاح');
                        closeWorkerModal();
                    })
                    .catch((error) => {
                        showError('حدث خطأ أثناء إضافة العامل');
                        console.error(error);
                    });
            } else {
                // تحديث
                const workersRef = firebase.database().ref(`restaurant-system/workers/${RESTAURANT_ID}/${currentWorkerId}`);
                workersRef.update(workerData)
                    .then(() => {
                        showSuccess('تم تحديث بيانات العامل بنجاح');
                        closeWorkerModal();
                    })
                    .catch((error) => {
                        showError('حدث خطأ أثناء تحديث العامل');
                        console.error(error);
                    });
            }
        });

        // عرض رسائل
        function showSuccess(message) {
            const alert = document.getElementById('success-alert');
            alert.textContent = message;
            alert.style.display = 'block';
            setTimeout(() => alert.style.display = 'none', 3000);
        }

        function showError(message) {
            const alert = document.getElementById('error-alert');
            alert.textContent = message;
            alert.style.display = 'block';
            setTimeout(() => alert.style.display = 'none', 3000);
        }

        // إغلاق النافذة عند الضغط خارجها
        document.getElementById('worker-modal').addEventListener('click', (e) => {
            if (e.target.id === 'worker-modal') {
                closeWorkerModal();
            }
        });

        // تحميل العمال عند تحميل الصفحة
        loadWorkers();

        // التحقق من تسجيل الدخول
        if (localStorage.getItem('admin_logged_in') !== 'true') {
            window.location.href = 'login-admin.html';
        }

        // دالة تسجيل الخروج
        function logout() {
            if (confirm('هل تريد تسجيل الخروج؟')) {
                localStorage.removeItem('admin_logged_in');
                localStorage.removeItem('admin_username');
                localStorage.removeItem('admin_name');
                localStorage.removeItem('admin_role');
                localStorage.removeItem('worker_logged_in');
                localStorage.removeItem('worker_username');
                localStorage.removeItem('worker_name');
                localStorage.removeItem('worker_role');
                localStorage.removeItem('worker_position');
                localStorage.removeItem('worker_id');
                localStorage.removeItem('restaurant_id');
                window.location.href = 'login-admin.html';
            }
        }
    </script>
</body>
</html>
